[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "market-signals"
version = "0.1.0"
description = "End-to-end ML pipeline for market signals on Google Cloud"
requires-python = ">=3.10"
license = "MIT"
dependencies = [
  "pandas>=2.2",
  "numpy>=1.26",
  "pyarrow>=15",
  "requests>=2.31",
  "scikit-learn>=1.4",
]

[project.optional-dependencies]
gcp = [
  "google-cloud-bigquery>=3.20",
  "db-dtypes>=1.2",
]
dev = [
  "pytest>=8",
  "ruff>=0.4",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
